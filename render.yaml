services:
  # ========================================================
  # ReachInbox Email Scheduler Backend Service
  # ========================================================
  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app # Replace with your Vercel URL
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString

# ========================================================
# Managed PostgreSQL Database on Render
# ========================================================
databases:
  - name: reachinbox-postgres
    plan: free
    databaseName: reachinbox_scheduler
    user: reachinbox_user
